name: Auto-update Kavita

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check and update Kavita version
        id: update
        run: python .github/scripts/update_version.py

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kavita/config.yaml kavita/CHANGELOG.md README.md README_UK.md
          git commit -m "chore: bump Kavita to upstream version ${{ steps.update.outputs.version }}"
          git push
